name: Build NOVA
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3

      - name: Build
        run: |
          set +e
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "----- ошибки сборки -----"
            grep -nE "^e: |error:|FAILURE:|What went wrong|> Task.*FAILED|Unresolved|Caused by|Could not|Compilation error" build.log | head -60
            grep -E "^e: |error:|FAILURE:|What went wrong|> Task.*FAILED|Unresolved|Caused by|Could not" build.log \
              | head -40 | cut -c1-600 | while IFS= read -r line; do
                echo "::error::${line}"
              done
            exit "$code"
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nova-apk
          path: app/build/outputs/apk/debug/app-debug.apk
